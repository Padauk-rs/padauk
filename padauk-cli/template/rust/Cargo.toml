[package]
name = "rust"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
uniffi = { version = "0.31.0" }
uuid = { version = "1.19.0", features = ["v4"] }
padauk = { path = "../../../padauk/padauk", features = ["web"] }

[features]
web = ["padauk/web"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1.19.0", features = ["v4", "js"] }
